name: Release

# Builds the downloadable apps whenever the version in package.json changes on main
# (or on demand) and publishes them as a GitHub Release tagged v<version>, with fixed
# file names so these links always fetch the latest:
#   https://github.com/<owner>/<repo>/releases/latest/download/Kawalees-Windows-Setup.exe
#   …/Kawalees-Mac.dmg · …/Kawalees-Linux.AppImage · …/Kawalees-Android.apk

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write
  # Signed build provenance: ties each download to this repository and commit.
  id-token: write
  attestations: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is already released; bump the version in package.json for a new one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, target: --win }
          - { name: macOS, os: macos-latest, target: --mac }
          - { name: Linux, os: ubuntu-latest, target: --linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:native
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  android:
    name: Android
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:native
      # The Android project is generated fresh on each release instead of living in the repo.
      - run: npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/assets@4
      - run: npx cap add android
      - name: App icon and splash
        run: |
          mkdir -p assets
          cp build/icon.png assets/logo.png
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0E0B12' --iconBackgroundColorDark '#0E0B12' \
            --splashBackgroundColor '#0E0B12' --splashBackgroundColorDark '#0E0B12'
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Kawalees-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Kawalees-Android.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # A signed record, made by GitHub, that these exact files were built from this repository.
      # Anyone can check a download with:  gh attestation verify <file> --repo reemalfadly/kawalees
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: كواليس ${{ needs.version.outputs.tag }}
          make_latest: true
          files: out/*
          body: |
            ## تحميل كواليس

            | الجهاز | الملف |
            | --- | --- |
            | ويندوز | **Kawalees-Windows-Setup.exe** |
            | ماك (Apple Silicon و Intel) | **Kawalees-Mac.dmg** |
            | أندرويد | **Kawalees-Android.apk** |
            | لينكس | **Kawalees-Linux.AppImage** |
            | آيفون وآيباد | من المتصفح: Safari ← المشاركة ← «إضافة إلى الشاشة الرئيسية» |

            **أول تشغيل:**
            - **ويندوز:** إذا طلع تنبيه «Windows protected your PC»: More info ← Run anyway.
            - **ماك:** فتح الملف وسحب Kawalees إلى Applications. أول مرة: إعدادات النظام ← الخصوصية والأمان ← «Open Anyway».
            - **أندرويد:** فتح الملف والسماح بالتثبيت من هذا المصدر.
            - **لينكس:** خصائص الملف ← السماح بالتشغيل، ثم فتحه.

            البيانات محفوظة على الجهاز نفسه. للنقل بين الأجهزة: الإعدادات ← تصدير نسخة، ثم استيراد في الجهاز الثاني.

